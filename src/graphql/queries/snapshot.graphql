query GetSnapshotPage($currency: CurrencyType!, $startDate: Date, $after: String) {
  amountSnapshotRelay(
    first: 100
    after: $after
    order: { date: ASC }
    filters: { currency: { exact: $currency }, date: { gte: $startDate } }
  ) {
    edges {
      node {
        id
        amount
        currency
        date
        summary
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
